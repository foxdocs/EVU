<!DOCTYPE html>
<html>
  <head>
    <title>The getElementById() Function</title>
    <script>
      function updateParagraphText(){
        let labelElement = document.getElementById('label');
        labelElement.innerText = 'Updated text: You just clicked the button!';
        labelElement.style.color = 'green';
      }
    </script>
  </head>
  <body>
    <button onclick="updateParagraphText();">
      Click me!
    </button>

    <p id="label">
      Original text: Click the button!
    </p>
    
  </body>
</html>
